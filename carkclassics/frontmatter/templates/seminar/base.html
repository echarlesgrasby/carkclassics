<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Little Rock Eastern Classics Seminar{% endblock %}</title>
  <meta name="description" content="{% block description %}A free, text-centered reading group for the Eastern classics in Little Rock.{% endblock %}">
  <style>
    :root {
      --paper: #f2f4f1; --ink: #1d2733; --muted: #566270;
      --celadon: #2e5e57; --rule: #c9d1cc; --wash: #e5ebe7;
    }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #161d22; --ink: #e6ebe8; --muted: #9aa7a3; --celadon: #7fb5a8; --rule: #33413f; --wash: #1f2a2c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink);
      font: 1.125rem/1.7 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
    a { color: var(--celadon); text-underline-offset: 3px; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--celadon); outline-offset: 3px; }
    .wrap { max-width: 40rem; margin: 0 auto; padding: 0 1.25rem; }
    header.site { border-bottom: 1px solid var(--rule); padding: 1rem 0; }
    header.site .wrap { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; align-items: baseline; justify-content: space-between; }
    header.site .name { font-weight: 700; color: var(--ink); text-decoration: none; }
    nav a { margin-right: 1.25rem; }
    nav a[aria-current="page"] { color: var(--ink); text-decoration: none; font-weight: 700; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15; margin: 2.5rem 0 1rem; }
    h2 { font-size: 1.5rem; line-height: 1.25; margin: 2.5rem 0 .5rem; }
    h3 { font-size: 1.2rem; margin: 1.5rem 0 .25rem; }
    p, ul, ol, dl { margin: 0 0 1rem; }
    .muted { color: var(--muted); }
    .next { border-left: 4px solid var(--celadon); background: var(--wash); padding: 1rem 1.25rem; margin: 1.5rem 0; }
    .next p { margin: 0; }
    .next .when { font-size: 1.35rem; font-weight: 700; }
    .edition { display: flex; gap: 1rem; padding: 1rem 0; border-top: 1px solid var(--rule); }
    .edition img { width: 6rem; height: auto; align-self: flex-start; border: 1px solid var(--rule); }
    .edition .body { flex: 1; min-width: 0; }
    .edition .body p { margin-bottom: .5rem; }
    .group-pick { font-weight: 700; color: var(--celadon); }
    blockquote { margin: 1rem 0; padding-left: 1rem; border-left: 3px solid var(--rule); color: var(--muted); }
    footer.site { margin-top: 4rem; padding: 1.5rem 0 3rem; border-top: 1px solid var(--rule); font-size: .95rem; color: var(--muted); }
    .skip { position: absolute; left: -999px; } .skip:focus { left: 1rem; top: 1rem; background: var(--paper); padding: .5rem; }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site">
    <div class="wrap">
      <a class="name" href="{% url 'seminar:landing' %}">Central Arkansas Classics Society</a>
      <nav aria-label="Main">
        <a href="{% url 'seminar:texts' %}" {% if request.resolver_match.url_name == 'texts' %}aria-current="page"{% endif %}>Readings</a>
        <a href="{% url 'seminar:sessions' %}" {% if request.resolver_match.url_name == 'sessions' %}aria-current="page"{% endif %}>Minutes</a>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="site">
    <div class="wrap">
      <p>Minutes are anonymous: no participant is named without their permission.</p>
      {% block footer_extra %}{% endblock %}
    </div>
  </footer>
</body>
</html>
